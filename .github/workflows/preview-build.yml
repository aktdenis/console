# Builds stats-web from a branch of aktdenis/console and uploads the static
# output as a GitHub Actions artifact. Broadway downloads it and serves it.
#
# Triggered on demand by Broadway via workflow_dispatch.

name: Build stats-web preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ref to build, e.g. feat/stats-provider-network-tab"
        required: true
        type: string
      repo:
        description: "Fork repo, e.g. aktdenis/console"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        run: |
          mkdir repo && cd repo
          git init -q
          git remote add origin https://github.com/${{ inputs.repo }}.git
          git fetch -q --depth 1 origin "${{ inputs.ref }}"
          git checkout -q FETCH_HEAD
          # Slugify the branch name the same way Broadway does
          SLUG=$(echo "${{ inputs.ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/^-\|-$//g' | cut -c1-50)
          echo "PREVIEW_SLUG=branch-${SLUG}" >> $GITHUB_ENV

      - name: Install dependencies
        run: cd repo && npm ci

      - name: Patch for static export
        run: |
          CONFIG=repo/apps/stats-web/next.config.js
          sed -i 's/output: "standalone"/output: process.env.NEXT_STATIC_EXPORT === "1" ? "export" : "standalone"/' "$CONFIG"
          APP=repo/apps/stats-web/src/app
          rm -rf "$APP/api"
          rm -f "$APP/manifest.ts" "$APP/manifest.tsx" "$APP/manifest.js" "$APP/manifest.jsx"
          rm -f "$APP/sitemap.ts" "$APP/sitemap.tsx" "$APP/sitemap.js" "$APP/sitemap.jsx"
          rm -f "$APP/robots.ts" "$APP/robots.tsx" "$APP/robots.js" "$APP/robots.jsx"
          rm -f "$APP/icon.ts" "$APP/icon.tsx" "$APP/icon.js" "$APP/icon.jsx"
          rm -f "$APP/apple-icon.ts" "$APP/apple-icon.tsx" "$APP/apple-icon.js" "$APP/apple-icon.jsx"
          rm -f "$APP/opengraph-image.ts" "$APP/opengraph-image.tsx" "$APP/opengraph-image.js" "$APP/opengraph-image.jsx"
          rm -f "$APP/twitter-image.ts" "$APP/twitter-image.tsx" "$APP/twitter-image.js" "$APP/twitter-image.jsx"
          # Force-static the root layout so cookies()/headers() return empty values
          LAYOUT="$APP/layout.tsx"
          if [ -f "$LAYOUT" ]; then
            sed -i '1s/^/export const dynamic = "force-static";\n/' "$LAYOUT"
          fi
          # Write the Python patch script to a file (avoids heredoc indentation issues)
          cat > /tmp/static_patch.py << 'PYEOF'
import os

APP = 'repo/apps/stats-web/src/app'

# -----------------------------------------------------------------
# 1. Prepend generateStaticParams + dynamicParams to each dynamic
#    route page so Next.js static export can build them.
#    For doubly-nested [address]/[dseq], both parent params must be
#    returned because there is no intermediate layout.tsx.
# -----------------------------------------------------------------
DYNAMIC_PAGES = {
  f'{APP}/addresses/[address]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ address: '_preview_' }]; }\n",
  f'{APP}/addresses/[address]/deployments/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ address: '_preview_' }]; }\n",
  f'{APP}/addresses/[address]/deployments/[dseq]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ address: '_preview_', dseq: '_preview_' }]; }\n",
  f'{APP}/addresses/[address]/transactions/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ address: '_preview_' }]; }\n",
  f'{APP}/blocks/[height]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ height: '_preview_' }]; }\n",
  f'{APP}/bme-graph/[snapshot]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ snapshot: '_preview_' }]; }\n",
  f'{APP}/graph/[snapshot]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ snapshot: '_preview_' }]; }\n",
  f'{APP}/provider-graph/[snapshot]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ snapshot: '_preview_' }]; }\n",
  f'{APP}/transactions/[hash]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ hash: '_preview_' }]; }\n",
  f'{APP}/validators/[address]/page.tsx':
    "export const dynamicParams = false;\nexport function generateStaticParams() { return [{ address: '_preview_' }]; }\n",
}

for path, prefix in DYNAMIC_PAGES.items():
  if not os.path.exists(path):
    print(f'SKIP (not found): {path}')
    continue
  with open(path) as f:
    content = f.read()
  if 'generateStaticParams' in content:
    print(f'ALREADY PATCHED (GSP): {path}')
    continue
  with open(path, 'w') as f:
    f.write(prefix + content)
  print(f'PATCHED (GSP): {path}')

# -----------------------------------------------------------------
# 2. Add .default('mainnet') to Zod network schemas so prerendering
#    with empty searchParams doesn't throw a ZodError.
# -----------------------------------------------------------------
NETWORK_PAGES = [
  f'{APP}/addresses/[address]/page.tsx',
  f'{APP}/addresses/[address]/deployments/[dseq]/page.tsx',
  f'{APP}/blocks/[height]/page.tsx',
  f'{APP}/transactions/[hash]/page.tsx',
  f'{APP}/validators/[address]/page.tsx',
]

for path in NETWORK_PAGES:
  if not os.path.exists(path):
    continue
  with open(path) as f:
    content = f.read()
  if 'networkId.default' in content:
    print(f'ALREADY PATCHED (network default): {path}')
    continue
  new_content = content.replace('network: networkId', "network: networkId.default('mainnet')")
  if new_content != content:
    with open(path, 'w') as f:
      f.write(new_content)
    print(f'PATCHED (network default): {path}')

# -----------------------------------------------------------------
# 3. Convert error-throwing fetch functions to return null so that
#    prerendering with placeholder params renders a graceful
#    "not found" page instead of crashing the build.
#    Uses exact string replacement to avoid regex / brace issues.
# -----------------------------------------------------------------

def patch_file(path, replacements):
  if not os.path.exists(path):
    print(f'SKIP (not found): {path}')
    return
  with open(path) as f:
    content = f.read()
  changed = False
  for old, new in replacements:
    if old in content:
      content = content.replace(old, new)
      changed = True
    else:
      print(f'  WARN: pattern not found in {path}: {repr(old[:60])}')
  if changed:
    with open(path, 'w') as f:
      f.write(content)
    print(f'PATCHED (no-throw): {path}')

# addresses/[address]/deployments/[dseq]/page.tsx
patch_file(f'{APP}/addresses/[address]/deployments/[dseq]/page.tsx', [
  (
    '  if (!response.ok && response.status !== 404) {\n    logger.error({ event: "DEPLOYMENT_FETCH_ERROR", address, dseq, network, status: response.status });\n    throw new Error(`Error fetching deployment data: ${address}/${dseq}`);\n  } else if (response.status === 404) {\n    return null;\n  }',
    '  if (!response.ok) {\n    return null;\n  }'
  ),
])

# addresses/[address]/page.tsx
patch_file(f'{APP}/addresses/[address]/page.tsx', [
  (
    '  if (!response.ok && response.status !== 404) {\n    logger.error({ event: "ADDRESS_FETCH_ERROR", address, network, status: response.status });\n    throw new Error(`Error fetching address data: ${address}`);\n  } else if (response.status === 404) {\n    return null;\n  }',
    '  if (!response.ok) {\n    return null;\n  }'
  ),
])

# blocks/[height]/page.tsx
patch_file(f'{APP}/blocks/[height]/page.tsx', [
  (
    '  if (!response.ok && response.status !== 404) {\n    logger.error({ event: "BLOCK_FETCH_ERROR", height, network, status: response.status });\n    throw new Error(`Error fetching block data: ${height}`);\n  } else if (response.status === 404) {\n    logger.debug({ event: "BLOCK_NOT_FOUND", height, network });\n    return null;\n  }',
    '  if (!response.ok) {\n    return null;\n  }'
  ),
])

# transactions/[hash]/page.tsx
patch_file(f'{APP}/transactions/[hash]/page.tsx', [
  (
    '  if (!response.ok && response.status !== 404) {\n    logger.error({ event: "TRANSACTION_FETCH_ERROR", hash, network, status: response.status });\n    throw new Error(`Error fetching transaction data: ${hash}`);\n  } else if (response.status === 404) {\n    logger.debug({ event: "TRANSACTION_NOT_FOUND", hash, network });\n    return null;\n  }',
    '  if (!response.ok) {\n    return null;\n  }'
  ),
])

# validators/[address]/page.tsx — also needs null guard in page component
# and metadata generator, plus return type fix
patch_file(f'{APP}/validators/[address]/page.tsx', [
  # Fix the throw in fetchValidatorData
  (
    '  if (!response.ok) {\n    // This will activate the closest `error.js` Error Boundary\n    throw new Error("Error fetching validator data");\n  }',
    '  if (!response.ok) {\n    return null;\n  }'
  ),
  # Fix the return type to allow null
  (
    'async function fetchValidatorData(address: string, network: Network["id"]): Promise<ValidatorDetail>',
    'async function fetchValidatorData(address: string, network: Network["id"]): Promise<ValidatorDetail | null>'
  ),
  # Guard against bad API response in generateMetadata (fetch then json without ok check)
  (
    '  const data = (await response.json()) as ValidatorDetail;\n\n  return {\n    title: `Validator ${data.moniker}`,',
    "  if (!response.ok) { return { title: 'Validator Details', alternates: { canonical: url }, openGraph: { url } }; }\n  const data = (await response.json()) as ValidatorDetail;\n\n  return {\n    title: `Validator ${data.moniker}`,"
  ),
  # Add null guard in the page component before rendering
  (
    '  return (\n    <PageContainer>\n      <Title>Validator Details</Title>\n\n      <div className="mt-6">\n        <ValidatorsInfo validator={validator} />',
    '  if (!validator) {\n    return (\n      <PageContainer>\n        <Title>Validator Details</Title>\n        <div className="py-8 text-center text-muted-foreground">Validator not found.</div>\n      </PageContainer>\n    );\n  }\n\n  return (\n    <PageContainer>\n      <Title>Validator Details</Title>\n\n      <div className="mt-6">\n        <ValidatorsInfo validator={validator} />'
  ),
])

print('Patch complete.')
PYEOF
          python3 /tmp/static_patch.py
          echo "Remaining files in $APP:"
          find "$APP" -type f | sort

      - name: Build stats-web (static export)
        run: cd repo && NEXT_STATIC_EXPORT=1 npm run build --workspace=apps/stats-web
        env:
          SENTRY_AUTH_TOKEN: ""
          CI: "true"
          NEXT_PUBLIC_NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://console-api.akash.network
          NEXT_PUBLIC_BASE_API_MAINNET_URL: https://console-api.akash.network
          NEXT_PUBLIC_BASE_API_TESTNET_URL: https://console-api-testnet.akash.network
          NEXT_PUBLIC_BASE_API_SANDBOX_URL: https://console-api-sandbox.akash.network
          BASE_API_MAINNET_URL: https://console-api.akash.network
          BASE_API_TESTNET_URL: https://console-api-testnet.akash.network
          BASE_API_SANDBOX_URL: https://console-api-sandbox.akash.network

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ env.PREVIEW_SLUG }}-${{ github.run_id }}
          path: repo/apps/stats-web/out/
          retention-days: 7
          if-no-files-found: error
